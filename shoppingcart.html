<html>
  <head>
    <style>
      th, td{
        border: 2px solid #0056b3;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
   <table>
     <tr>
       <th>Item</th>
       <th>Quantity</th>
       <th>Action</th>
     </tr>
     <tr>
       <td>chips</td> 
       <td>Rs 50</td> 
       <td>
         <button id="chips">Add Chips to cart</button>
       </td>
     </tr>
     <tr>
       <td>Apple</td>
       <td>Rs 10</td>
       <td>
         <button id="apple">Add Apple to cart</button>
       </td>
     </tr>
   </table>

    <table>
      <tr>
        <th>Item</th>
        <th>Quantity</th>
      </tr>
      <tr>
        <td>Quantity of Chips</td>
        <td id="quantchips">0</td>
      </tr>
      <tr>
        <td>Quantity of Apple</td>
        <td id="quantapples">0</td>
      </tr>
    </table>

    <script>
      let chips = 0;
      let apple = 0;
      document.getElementById('chips').addEventListener('click', function(){
        chips++;
        document.getElementById('quantchips').textContent = chips;
      });
      document.getElementById('apple').addEventListener('click', function(){
        apple++;
        document.getElementById('quantapples').textContent = apple;
      });
    </script>
  </body>
</html>
